[package]
name = "zirveflow-desktop"
version = "0.1.0"
description = "ZirveFlow işletme yönetimi masaüstü uygulaması"
authors = ["ZirveFlow"]
edition = "2021"

[lib]
name = "zirveflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
