name: Build ZirveFlow desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

# Configure the private repository variable DESKTOP_API_URL with the deployed HTTPS app origin before tagging a release.
# The installer keeps the Next.js shell local; runtime API requests use the public auth/API origin.

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish installer
        uses: tauri-apps/tauri-action@v0
        env:
          NEXT_PUBLIC_BETTER_AUTH_URL: ${{ vars.DESKTOP_API_URL }}
          BETTER_AUTH_URL: ${{ vars.DESKTOP_API_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: desktop-v__VERSION__
          releaseName: ZirveFlow Desktop v__VERSION__
          releaseBody: Windows, macOS ve Linux kurulum paketleri.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
